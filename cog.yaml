# Configuration for Cog

build:
  gpu: true

  system_packages:
    - "ffmpeg"

  python_version: "3.10"

  # Spleeter 2.4 uses an older TensorFlow/Typer dependency stack.
  # Pin the complete stack so future builds remain reproducible.
  python_packages:
    - "numpy==1.23.5"
    - "protobuf==3.19.6"
    - "click==7.1.2"
    - "typer==0.3.2"
    - "tensorflow==2.9.3"
    - "pandas==1.5.3"
    - "spleeter==2.4.0"

  # Fail the GitHub build immediately if Spleeter cannot be imported.
  run:
    - 'python -c "from spleeter.audio.adapter import AudioAdapter; from spleeter.separator import Separator; print(\"Spleeter imports OK\")"'

predict: "predict.py:Predictor"
