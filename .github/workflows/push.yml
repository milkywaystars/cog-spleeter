name: Push Spleeter to Replicate

on:
  workflow_dispatch:

jobs:
  push_to_replicate:
    name: Build and push Spleeter
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          docker-images: false

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Cog
        uses: replicate/setup-cog@v2
        with:
          token: ${{ secrets.REPLICATE_CLI_AUTH_TOKEN }}

      - name: Build and push model
        run: cog push r8.im/milkywaystars/spleeter-mono-mp3
